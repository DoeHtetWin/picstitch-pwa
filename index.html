      //#endregion

      // ==========================================
      // #region 17. FREEFORM GEOMETRY
      // ==========================================
      function getMousePos(e) {
        const rect = fCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function sortCorners(pts) {
        const center = {
          x: pts.reduce((s, p) => s + p.x, 0) / 4,
          y: pts.reduce((s, p) => s + p.y, 0) / 4,
        };
        pts.sort(
          (a, b) =>
            Math.atan2(a.y - center.y, a.x - center.x) -
            Math.atan2(b.y - center.y, b.x - center.x),
        );
        let topLeft = pts.reduce((prev, curr) =>
          curr.x + curr.y < prev.x + prev.y ? curr : prev,
        );
        while (pts[0] !== topLeft) pts.push(pts.shift());
        return pts;
      }
      //#endregion

      // ==========================================
      // #region 18. FREEFORM RENDERING
      // ==========================================
      function initFreeCrop() {
        const img = document.getElementById("freeCropImage");
        const container = document.getElementById("freeCropContainer");
        if (container.clientWidth === 0 || img.naturalWidth === 0) {
          requestAnimationFrame(initFreeCrop);
          return;
        }

        fCanvas.width = container.clientWidth;
        fCanvas.height = container.clientHeight;
        const imgRatio = img.naturalWidth / img.naturalHeight;
        const containerRatio = fCanvas.width / fCanvas.height;
        let drawW,
          drawH,
          offsetX = 0,
          offsetY = 0;
        if (imgRatio > containerRatio) {
          drawW = fCanvas.width;
          drawH = drawW / imgRatio;
          offsetY = (fCanvas.height - drawH) / 2;
        } else {
          drawH = fCanvas.height;
          drawW = drawH * imgRatio;
          offsetX = (fCanvas.width - drawW) / 2;
        }
      // A tiny 2px pad keeps the stroke fully inside the canvas
        const p = 2; 
        freeCorners = [
          { x: offsetX + p, y: offsetY + p },
          { x: offsetX + drawW - p, y: offsetY + p },
          { x: offsetX + drawW - p, y: offsetY + drawH - p },
          { x: offsetX + p, y: offsetY + drawH - p },
        ];
        drawFreeCrop();
      }

      function drawFreeCrop() {
        const c = fCanvas.getContext("2d");
        c.clearRect(0, 0, fCanvas.width, fCanvas.height);
        c.fillStyle = "rgba(0,0,0,0.6)";
        c.beginPath();
        c.rect(0, 0, fCanvas.width, fCanvas.height);
        c.moveTo(freeCorners[0].x, freeCorners[0].y);
        c.lineTo(freeCorners[3].x, freeCorners[3].y);
        c.lineTo(freeCorners[2].x, freeCorners[2].y);
        c.lineTo(freeCorners[1].x, freeCorners[1].y);
        c.closePath();
        c.fill("evenodd");

        c.strokeStyle = "#0ea5e9";
        c.lineWidth = 2.5;
        c.beginPath();
        c.moveTo(freeCorners[0].x, freeCorners[0].y);
        c.lineTo(freeCorners[1].x, freeCorners[1].y);
        c.lineTo(freeCorners[2].x, freeCorners[2].y);
        c.lineTo(freeCorners[3].x, freeCorners[3].y);
        c.closePath();
        c.stroke();

        const hr = 30,
          ls = 18;
        c.lineWidth = 4;
        c.strokeStyle = "#3b82f6";
        freeCorners.forEach((p, i) => {
          c.beginPath();
          c.arc(p.x, p.y, hr, 0, Math.PI * 2);
          c.fillStyle = "rgba(120,140,255,0.22)";
          c.fill();
          c.beginPath();
          if (i === 0) {
            c.moveTo(p.x + ls, p.y);
            c.lineTo(p.x, p.y);
            c.lineTo(p.x, p.y + ls);
          } else if (i === 1) {
            c.moveTo(p.x - ls, p.y);
            c.lineTo(p.x, p.y);
            c.lineTo(p.x, p.y + ls);
          } else if (i === 2) {
            c.moveTo(p.x - ls, p.y);
            c.lineTo(p.x, p.y);
            c.lineTo(p.x, p.y - ls);
          } else {
            c.moveTo(p.x + ls, p.y);
            c.lineTo(p.x, p.y);
            c.lineTo(p.x, p.y - ls);
          }
          c.stroke();
        });
      }
      //#endregion

      // ==========================================
      // #region 19. FREEFORM INTERACTION
      // ==========================================
      function startDrag(e) {
        if (!isFreeForm) return;
        const pos = getMousePos(e);
        let minDist = 65;
        activeCorner = null;
        freeCorners.forEach((c) => {
          const dist = Math.hypot(c.x - pos.x, c.y - pos.y);
          if (dist < minDist) {
            minDist = dist;
            activeCorner = c;
          }
        });
        if (activeCorner) {
          dragOffsetX = pos.x - activeCorner.x;
          dragOffsetY = pos.y - activeCorner.y;
          lastTouchX = pos.x;
          lastTouchY = pos.y;
          e.preventDefault();
        }
      }

      function drag(e) {
        if (!isFreeForm || !activeCorner) return;
        e.preventDefault();
        const pos = getMousePos(e);
        const sensitivity = 0.5;
        activeCorner.x += (pos.x - lastTouchX) * sensitivity;
        activeCorner.y += (pos.y - lastTouchY) * sensitivity;

        const img = document.getElementById("freeCropImage");
        const imgRatio = img.naturalWidth / img.naturalHeight;
        const containerRatio = fCanvas.width / fCanvas.height;
        let drawW,
          drawH,
          offsetX = 0,
          offsetY = 0;
        if (imgRatio > containerRatio) {
          drawW = fCanvas.width;
          drawH = drawW / imgRatio;
          offsetY = (fCanvas.height - drawH) / 2;
        } else {
          drawH = fCanvas.height;
          drawW = drawH * imgRatio;
          offsetX = (fCanvas.width - drawW) / 2;
        }

        const p = 2;
        activeCorner.x = Math.max(
          offsetX + p,
          Math.min(offsetX + drawW - p, activeCorner.x),
        );
        activeCorner.y = Math.max(
          offsetY + p,
          Math.min(offsetY + drawH - p, activeCorner.y),
        );

        lastTouchX = pos.x;
        lastTouchY = pos.y;
        requestAnimationFrame(drawFreeCrop);
      }

      function stopDrag() {
        activeCorner = null;
      }
      //#endregion

      // ==========================================
      // #region 20. FREEFORM APPLY ENGINE
      // ==========================================
      function applyFreeFormCrop() {
        const btn = document.getElementById("applyBtn");
        btn.innerText = "Applying Matrix...";
        btn.disabled = true;

        requestAnimationFrame(() => {
          const img = document.getElementById("freeCropImage");
          const imgRatio = img.naturalWidth / img.naturalHeight;
          const containerRatio = fCanvas.width / fCanvas.height;
          let drawW,
            drawH,
            offsetX = 0,
            offsetY = 0;
          if (imgRatio > containerRatio) {
            drawW = fCanvas.width;
            drawH = drawW / imgRatio;
            offsetY = (fCanvas.height - drawH) / 2;
          } else {
            drawH = fCanvas.height;
            drawW = drawH * imgRatio;
            offsetX = (fCanvas.width - drawW) / 2;
          }

          const scale = img.naturalWidth / drawW;
          const pts = sortCorners(
            freeCorners.map((c) => ({
              x: (c.x - offsetX) * scale,
              y: (c.y - offsetY) * scale,
            })),
          );

          const w1 = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          const w2 = Math.hypot(pts[2].x - pts[3].x, pts[2].y - pts[3].y);
          const h1 = Math.hypot(pts[3].x - pts[0].x, pts[3].y - pts[0].y);
          const h2 = Math.hypot(pts[2].x - pts[1].x, pts[2].y - pts[1].y);

          const wMax = Math.max(w1, w2);
          const wMin = Math.min(w1, w2);
          const hMax = Math.max(h1, h2);
          const hMin = Math.min(h1, h2);

          // Calculate convergence to detect optical foreshortening.
          // Clamped to 0.15 to prevent memory crashes on extreme perspective drags.
          const vConverge = wMax > 0 ? Math.max(0.25, wMin / wMax) : 1; 
          const hConverge = hMax > 0 ? Math.max(0.25, hMin / hMax) : 1;

          // Expand the dimensions using the inverse square root of the convergence.
          // This elegantly undoes the optical depth compression to recover true aspect ratio.
          const destW = Math.round(wMax * (1 / Math.sqrt(hConverge)));
          const destH = Math.round(hMax * (1 / Math.sqrt(vConverge)));

          const offscreen = document.createElement("canvas");
          offscreen.width = destW;
          offscreen.height = destH;

          /* const limits = getDeviceLimits();

          if (destW * destH > limits.area) {
            const scale = Math.sqrt(
              limits.area / (destW * destH)
            );

            destW = Math.round(destW * scale);
            destH = Math.round(destH * scale);
          } */

          const offCtx = offscreen.getContext("2d", {
            willReadFrequently: true,
          });

          const srcCanvas = document.createElement("canvas");
          srcCanvas.width = img.naturalWidth;
          srcCanvas.height = img.naturalHeight;
          srcCanvas
            .getContext("2d", { willReadFrequently: true })
            .drawImage(img, 0, 0);
          const srcData = srcCanvas
            .getContext("2d")
            .getImageData(0, 0, srcCanvas.width, srcCanvas.height);
          const destData = offCtx.createImageData(destW, destH);
          const srcBuf = new Uint32Array(srcData.data.buffer);
          const destBuf = new Uint32Array(destData.data.buffer);
          const sw = srcCanvas.width,
            sh = srcCanvas.height;

          // 1. Extract the four corners
          const x0 = pts[0].x, y0 = pts[0].y;
          const x1 = pts[1].x, y1 = pts[1].y;
          const x2 = pts[2].x, y2 = pts[2].y;
          const x3 = pts[3].x, y3 = pts[3].y;

          // 2. Calculate algebraic projective coefficients
          const dx1 = x1 - x2;
          const dx2 = x3 - x2;
          const sumX = x0 - x1 + x2 - x3;

          const dy1 = y1 - y2;
          const dy2 = y3 - y2;
          const sumY = y0 - y1 + y2 - y3;

          const D = (dx1 * dy2) - (dx2 * dy1);
          
          let g = 0, h = 0;
          if (D !== 0) {
            g = ((sumX * dy2) - (sumY * dx2)) / D;
            h = ((sumY * dx1) - (sumX * dy1)) / D;
          }

          const a = x1 - x0 + g * x1;
          const b = x3 - x0 + h * x3;
          const c = x0;
          const d = y1 - y0 + g * y1;
          const e = y3 - y0 + h * y3;
          const f = y0;

          // 3. Render the pixels using true perspective mapping
          for (let y = 0; y < destH; y++) {
            const v = y / (destH - 1 || 1);
            for (let x = 0; x < destW; x++) {
              const u = x / (destW - 1 || 1);
              
              // Apply perspective division
              const w = g * u + h * v + 1;
              const sx = (a * u + b * v + c) / w;
              const sy = (d * u + e * v + f) / w;

              // Keep your excellent Bilinear sub-pixel interpolation!
              if (sx >= 0 && sx < sw - 1 && sy >= 0 && sy < sh - 1) {
                const ix = Math.floor(sx), iy = Math.floor(sy);
                const fx = sx - ix, fy = sy - iy;
                
                const p00 = srcBuf[iy * sw + ix];
                const p10 = srcBuf[iy * sw + (ix + 1)];
                const p01 = srcBuf[(iy + 1) * sw + ix];
                const p11 = srcBuf[(iy + 1) * sw + (ix + 1)];
                
                const lerp = (v1, v2, t) => v1 + (v2 - v1) * t;
                
                const r = Math.round(lerp(
                  lerp(p00 & 0xff, p10 & 0xff, fx),
                  lerp(p01 & 0xff, p11 & 0xff, fx), fy
                ));
                const green = Math.round(lerp(
                  lerp((p00 >> 8) & 0xff, (p10 >> 8) & 0xff, fx),
                  lerp((p01 >> 8) & 0xff, (p11 >> 8) & 0xff, fx), fy
                ));
                const blue = Math.round(lerp(
                  lerp((p00 >> 16) & 0xff, (p10 >> 16) & 0xff, fx),
                  lerp((p01 >> 16) & 0xff, (p11 >> 16) & 0xff, fx), fy
                ));
                const alpha = Math.round(lerp(
                  lerp((p00 >> 24) & 0xff, (p10 >> 24) & 0xff, fx),
                  lerp((p01 >> 24) & 0xff, (p11 >> 24) & 0xff, fx), fy
                ));
                
                destBuf[y * destW + x] = (alpha << 24) | (blue << 16) | (green << 8) | r;
              }
            }
          }

          offCtx.putImageData(destData, 0, 0);
          offscreen.toBlob(
            (blob) => {
              const url = URL.createObjectURL(blob);
              cleanupCanvas(srcCanvas);
              cleanupCanvas(offscreen);

              if (cropMode === "combined") {
                const finalImg = new Image();
                finalImg.onload = () => {
                  canvas.width = finalImg.width;
                  canvas.height = finalImg.height;
                  ctx.clearRect(0, 0, canvas.width, canvas.height);
                  ctx.drawImage(finalImg, 0, 0);
                  URL.revokeObjectURL(url);
                  // FIX: Invalidate combined cache after perspective crop on canvas
                  if (combinedCanvasCacheUrl) {
                    URL.revokeObjectURL(combinedCanvasCacheUrl);
                    combinedCanvasCacheUrl = null;
                  }
                  closeCrop();
                  btn.innerText = "Apply";
                  btn.disabled = false;
                };
                finalImg.src = url;
              } else {
                const imgObj = images[currentCropIndex];
                if (imgObj.original?.startsWith("blob:"))
                  URL.revokeObjectURL(imgObj.original);
                const previewUrl = URL.createObjectURL(blob);
                const updatedImg = new Image();
                updatedImg.onload = () => {
                imgObj.current = previewUrl;
                imgObj.original = previewUrl;
                imgObj.img = updatedImg;

                if (imgObj.rawBitmap) {
                  try {
                    imgObj.rawBitmap.close();
                  } catch (e) {}
                }

                imgObj.rawBitmap = null;
                  
                  // FIX: Update rawMeta after perspective crop
                  imgObj.rawMeta = {
                    file: blob,
                    width: updatedImg.naturalWidth,
                    height: updatedImg.naturalHeight,
                  };
                  imgObj.rawRatio = 1;
                  imgObj.cropData = null;
                  imgObj.freeFormData = true;
                  renderPreview();
                  openCrop(currentCropIndex, true);
                  btn.innerText = "Apply";
                  btn.disabled = false;
                };
                updatedImg.src = previewUrl;
              }
            },
            "image/png",
            1,
          );
        });
      }
      
      //#endregion

      // ==========================================
      // #region 21. EXPORT ENGINE
      // ==========================================
      async function downloadImage(e) {
        if (isProcessing) return;
        isProcessing = true;

        flashButton(document.getElementById("exportImageBtn"));
        const btn = e.target;
        const originalText = btn.innerText;
        btn.innerText = "Processing...";
        btn.style.opacity = "0.7";
        btn.disabled = true;
        lockUI(true);
        await new Promise((r) => setTimeout(r, 50));

        try {
          document.body.style.transform = "translateZ(0)";
          await new Promise((r) => requestAnimationFrame(r));
          document.body.offsetHeight;

          const qualitySelect = document.getElementById("qualitySelect").value;
          const isPNG = qualitySelect === "png";
          const exportFormat = isPNG ? "image/png" : "image/jpeg";
          const quality = isPNG ? 1 : Number(qualitySelect);
          const fileExtension = isPNG ? "png" : "jpg";

          if (canvas.width > 1 && canvas.height > 1) {
            validateCanvasSize();
            let blob;
            // FIX: Skip redundant canvas copy for PNG — export directly at native res
            if (isPNG) {
              blob = await exportCanvasBlob("image/png", 1);
            } else {
              let maxW;
              if (qualitySelect === "0.45") maxW = 1400;
              else if (qualitySelect === "0.65") maxW = 2200;
              else maxW = 3200;
              const scale = Math.min(1, maxW / canvas.width);
              const ec = document.createElement("canvas");
              ec.width = Math.round(canvas.width * scale);
              ec.height = Math.round(canvas.height * scale);
              const ec2 = ec.getContext("2d");
              ec2.imageSmoothingEnabled = true;
              ec2.imageSmoothingQuality = "high";
              ec2.drawImage(canvas, 0, 0, ec.width, ec.height);
              blob = await new Promise((r) =>
                ec.toBlob(r, exportFormat, quality),
              );
            }
            if (!blob) throw new Error("Export failed");

            const file = new File(
              [blob],
              `PicStitch_${Date.now()}.${fileExtension}`,
              { type: exportFormat },
            );
            const isIOS =
              /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" &&
                navigator.maxTouchPoints > 1);

            if (
              isIOS &&
              navigator.canShare &&
              navigator.canShare({ files: [file] })
            ) {
              try {
                await navigator.share({ files: [file] });
                showToast("Shared Successfully!");
              } catch (err) {
                console.log("Share cancelled.");
              }
            } else {
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.download = file.name;
              link.href = url;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(url), 1000);
              if (!isIOS) showToast("Image Saved Successfully!");
            }
            return;
          }

          const selectedImages = images.filter((img) => img.selected);
          if (selectedImages.length === 0) {
            showToast("No selected image to export", true);
            return;
          }

          const generatedFiles = [];
          for (let i = 0; i < selectedImages.length; i++) {
            const imgObj = selectedImages[i];
            const img = new Image();
            await new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = reject;
              img.src = imgObj.current;
            });

            const limits = getDeviceLimits();
            let tw = img.naturalWidth,
              th = img.naturalHeight,
              ss = 1;
            if (tw * th > limits.area) ss = Math.sqrt(limits.area / (tw * th));
            if (th * ss > limits.dimension) ss = limits.dimension / th;
            if (tw * ss > limits.dimension) ss = limits.dimension / tw;

            const tc = document.createElement("canvas");
            tc.width = Math.round(tw * ss);
            tc.height = Math.round(th * ss);
            const tc2 = tc.getContext("2d");
            tc2.imageSmoothingEnabled = true;
            tc2.imageSmoothingQuality = "high";
            tc2.drawImage(img, 0, 0, tc.width, tc.height);
            const blob = await new Promise((r) =>
              tc.toBlob(r, exportFormat, quality),
            );
            generatedFiles.push(
              new File(
                [blob],
                `PicStitch_Selected_${Date.now()}_${i + 1}.${fileExtension}`,
                { type: exportFormat },
              ),
            );
          }

          const isIOS =
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

          if (
            isIOS &&
            navigator.canShare &&
            navigator.canShare({ files: generatedFiles })
          ) {
            try {
              await navigator.share({
                files: generatedFiles,
                title:
                  selectedImages.length > 1
                    ? "PicStitch Batch Export"
                    : "PicStitch Export",
              });
              showToast(
                selectedImages.length > 1
                  ? "Images Shared Successfully!"
                  : "Image Shared Successfully!",
              );
            } catch (err) {
              console.log("Share cancelled.");
            }
          } else {
            for (let i = 0; i < generatedFiles.length; i++) {
              const file = generatedFiles[i];
              const url = URL.createObjectURL(file);
              const link = document.createElement("a");
              link.download = file.name;
              link.href = url;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(url), 2000);
              if (generatedFiles.length > 1)
                await new Promise((r) => setTimeout(r, 250));
            }
            if (!isIOS)
              showToast(
                generatedFiles.length > 1
                  ? "Selected Images Saved!"
                  : "Selected Image Saved!",
              );
          }
        } catch (error) {
          console.error("Export failed:", error);
          showToast("Export failed", true);
        } finally {
          document.body.style.transform = "";
          btn.innerText = originalText;
          btn.style.opacity = "1";
          btn.disabled = false;
          lockUI(false);
          isProcessing = false;
          releaseRawBitmaps();
        }
      }

      async function exportPDF(e) {
        if (isProcessing) return;
        isProcessing = true;
        lockUI(true);

        flashButton(document.getElementById("exportPdfBtn"));
        const btn = e.target;
        const originalText = btn.innerText;
        btn.innerText = "Processing...";
        btn.style.opacity = "0.7";
        btn.disabled = true;
        await new Promise((r) => setTimeout(r, 50));

        try {
          document.body.style.transform = "translateZ(0)";
          await new Promise((r) => requestAnimationFrame(r));
          document.body.offsetHeight;

          const { jsPDF } = window.jspdf;
          const qualitySelect = document.getElementById("qualitySelect").value;
          const isPNG = qualitySelect === "png";

          /* const mimeType = isPNG ? "image/png" : "image/jpeg";
          const jsPdfFormat = isPNG ? "PNG" : "JPEG";
          const quality = isPNG ? 1 : Number(qualitySelect); */

          const mimeType = "image/jpeg";
          const jsPdfFormat = "JPEG";
          const quality =
            qualitySelect === "png" ? 0.98 : Number(qualitySelect);

          if (canvas.width > 1 && canvas.height > 1) {
            validateCanvasSize();
            const pdfWidth = 800;
            const pdfHeight = canvas.height * (pdfWidth / canvas.width);
            const pdf = new jsPDF({
              orientation: pdfHeight > pdfWidth ? "portrait" : "landscape",
              unit: "px",
              format: [pdfWidth, pdfHeight],
            });
            const blob = await exportCanvasBlob(mimeType, quality);
            const url = URL.createObjectURL(blob);
            const img = new Image();
            await new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = reject;
              img.src = url;
            });
            pdf.addImage(img, jsPdfFormat, 0, 0, pdfWidth, pdfHeight);
            URL.revokeObjectURL(url);
            const pdfBlob = pdf.output("blob");
            const file = new File([pdfBlob], `PicStitch_${Date.now()}.pdf`, {
              type: "application/pdf",
            });
            const isIOS =
              /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" &&
                navigator.maxTouchPoints > 1);

            if (
              isIOS &&
              navigator.canShare &&
              navigator.canShare({ files: [file] })
            ) {
              try {
                await navigator.share({ files: [file] });
                showToast("Shared Successfully!");
              } catch (err) {
                console.log("Share cancelled.");
              }
            } else {
              const pdfUrl = URL.createObjectURL(pdfBlob);
              const link = document.createElement("a");
              link.download = file.name;
              link.href = pdfUrl;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(pdfUrl), 1000);
              if (!isIOS) showToast("PDF Saved Successfully!");
            }
            return;
          }

          const selectedImages = images.filter((img) => img.selected);
          if (selectedImages.length === 0) {
            showToast("No selected image to export", true);
            return;
          }

          let combineIntoOne = false;
          if (selectedImages.length > 1) {
            document.body.style.transform = "";

            lockUI(false); // allow PDF modal buttons to be clicked

            const choice = await getPdfExportChoice();

            lockUI(true); // lock again after modal closes

            if (choice === "cancel") {
              document.body.style.transform = "";
              btn.innerText = originalText;
              btn.style.opacity = "1";
              btn.disabled = false;
              return;
            }

            document.body.style.transform = "translateZ(0)";
            combineIntoOne = choice === "combine";
          }

          if (combineIntoOne) {
            let pdf = null;
            for (let i = 0; i < selectedImages.length; i++) {
              const imgObj = selectedImages[i];
              const exportImg = await getRawBitmap(imgObj);
              const tc = document.createElement("canvas");
              tc.width = exportImg.width;
              tc.height = exportImg.height;
              tc.getContext("2d").drawImage(exportImg, 0, 0);
              const cleanData = tc.toDataURL(mimeType, quality);
              const pdfW = 800,
                pdfH = tc.height * (800 / tc.width);
              const orient = pdfH > pdfW ? "portrait" : "landscape";
              if (i === 0)
                pdf = new jsPDF({
                  orientation: orient,
                  unit: "px",
                  format: [pdfW, pdfH],
                });
              else pdf.addPage([pdfW, pdfH], orient);
              pdf.addImage(cleanData, jsPdfFormat, 0, 0, pdfW, pdfH);
            }
            const pdfBlob = pdf.output("blob");
            const file = new File(
              [pdfBlob],
              `PicStitch_MultiPage_${Date.now()}.pdf`,
              { type: "application/pdf" },
            );
            const isIOS =
              /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" &&
                navigator.maxTouchPoints > 1);

            if (
              isIOS &&
              navigator.canShare &&
              navigator.canShare({ files: [file] })
            ) {
              try {
                await navigator.share({
                  files: [file],
                  title: "PicStitch Multi-Page PDF",
                });
                showToast("PDF Shared Successfully!");
              } catch (err) {
                console.log("Share cancelled.");
              }
            } else {
              const pdfUrl = URL.createObjectURL(pdfBlob);
              const link = document.createElement("a");
              link.download = file.name;
              link.href = pdfUrl;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(pdfUrl), 1000);
              if (!isIOS) showToast("PDF Saved!");
            }
          } else {
            const generatedFiles = [];
            for (let i = 0; i < selectedImages.length; i++) {
              const imgObj = selectedImages[i];
              const exportImg = await getRawBitmap(imgObj);
              const tc = document.createElement("canvas");
              tc.width = exportImg.width;
              tc.height = exportImg.height;
              tc.getContext("2d").drawImage(exportImg, 0, 0);
              const cleanData = tc.toDataURL(mimeType, quality);
              const pdfW = 800,
                pdfH = tc.height * (800 / tc.width);
              const pdf = new jsPDF({
                orientation: pdfH > pdfW ? "portrait" : "landscape",
                unit: "px",
                format: [pdfW, pdfH],
              });
              pdf.addImage(cleanData, jsPdfFormat, 0, 0, pdfW, pdfH);
              const pdfBlob = pdf.output("blob");
              generatedFiles.push(
                new File(
                  [pdfBlob],
                  `PicStitch_Selected_${Date.now()}_${i + 1}.pdf`,
                  { type: "application/pdf" },
                ),
              );
            }
            const isIOS =
              /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" &&
                navigator.maxTouchPoints > 1);

            if (
              isIOS &&
              navigator.canShare &&
              navigator.canShare({ files: generatedFiles })
            ) {
              try {
                await navigator.share({
                  files: generatedFiles,
                  title:
                    selectedImages.length > 1
                      ? "PicStitch Batch PDFs"
                      : "PicStitch PDF",
                });
                showToast(
                  selectedImages.length > 1
                    ? "PDFs Shared Successfully!"
                    : "PDF Shared Successfully!",
                );
              } catch (err) {
                console.log("Share cancelled.");
              }
            } else {
              for (let i = 0; i < generatedFiles.length; i++) {
                const file = generatedFiles[i];
                const url = URL.createObjectURL(file);
                const link = document.createElement("a");
                link.download = file.name;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 2000);
                if (generatedFiles.length > 1)
                  await new Promise((r) => setTimeout(r, 250));
              }
              if (!isIOS)
                showToast(
                  generatedFiles.length > 1 ? "PDFs Saved!" : "PDF Saved!",
                );
            }
          }
        } catch (error) {
          console.error("Export failed:", error);
          showToast("Export failed", true);
        } finally {
          document.body.style.transform = "";
          btn.innerText = originalText;
          btn.style.opacity = "1";
          btn.disabled = false;
          lockUI(false);
          isProcessing = false;
          releaseRawBitmaps();
        }
      }

      function saveCanvasAsGroup() {
        flashButton(document.getElementById("saveGroupBtn"));
        if (isProcessing) return;
        isProcessing = true;
        lockUI(true);

        if (canvas.width <= 1 || canvas.height <= 1) {
          showToast("Please stitch images first", true);
          isProcessing = false;
          lockUI(false);
          return;
        }

        canvas.toBlob((blob) => {
          if (!blob) {
            isProcessing = false;
            lockUI(false);
            alert("This group is too large.");
            return;
          }

          const dataUrl = URL.createObjectURL(blob);
          const img = new Image();

          // FIX: Handle image load failure to guarantee UI unlock
          img.onerror = () => {
            isProcessing = false;
            lockUI(false);
            showToast("Failed to save group", true);
          };

          img.onload = () => {
            try {
              images = images.filter((item) => {
                if (item.selected) {
                  if (item.original?.startsWith("blob:"))
                    URL.revokeObjectURL(item.original);
                  if (
                    item.current?.startsWith("blob:") &&
                    item.current !== item.original
                  )
                    URL.revokeObjectURL(item.current);
                  return false;
                }
                return true;
              });

              // FIX: Removed redundant pristineRawClone — it was never referenced anywhere
              const pristineUiClone = new Image();
              pristineUiClone.onerror = () => {
                isProcessing = false;
                lockUI(false);
                showToast("Failed to save group", true);
              };
              pristineUiClone.onload = () => {
                images.push({
                  id: window.crypto?.randomUUID?.() ?? Date.now().toString(36),
                  original: dataUrl,
                  current: dataUrl,
                  img,
                  rawImg: img,
                  rawRatio: 1,
                  rawMeta: {
                    file: blob,
                    width: img.naturalWidth,
                    height: img.naturalHeight,
                  },
                  pristineUrl: dataUrl,
                  pristineImg: pristineUiClone,
                  freeFormData: null,
                  isGroup: true,
                  selected: true,
                });

                const validIds = new Set(images.map((img) => img.id));
                for (const key in cropHistory)
                  if (key !== "combined" && !validIds.has(key))
                    delete cropHistory[key];
                for (const key in redoHistory)
                  if (key !== "combined" && !validIds.has(key))
                    delete redoHistory[key];

                combineMode = null;
                clearCanvas();
                renderPreview();
                if (images.length === 1) {
                  combineVertical(false, false);
                  combineMode = null;
                }
                showToast("Group Saved Successfully!");
                isProcessing = false;
                lockUI(false);
              };
              pristineUiClone.src = dataUrl;
            } catch (err) {
              console.error("saveCanvasAsGroup error:", err);
              isProcessing = false;
              lockUI(false);
              showToast("Failed to save group", true);
            }
          };
          img.src = dataUrl;
        }, "image/png");
      }

      function getPdfExportChoice() {
        return new Promise((resolve) => {
          const modal = document.getElementById("pdfModal");
          modal.style.display = "flex";
          const cleanup = () => {
            modal.style.display = "none";
            document.getElementById("btnCombinePdf").onclick = null;
            document.getElementById("btnSeparatePdf").onclick = null;
            document.getElementById("btnCancelPdf").onclick = null;
          };
          document.getElementById("btnCombinePdf").onclick = () => {
            cleanup();
            resolve("combine");
          };
          document.getElementById("btnSeparatePdf").onclick = () => {
            cleanup();
            resolve("separate");
          };
          document.getElementById("btnCancelPdf").onclick = () => {
            cleanup();
            resolve("cancel");
          };
        });
      }
      
      //#endregion

      // ==========================================
      // #region 22. APP INITIALIZATION
      // ==========================================
      clearCanvas();

      window.addEventListener("beforeunload", () => {
        images.forEach((image) => {
          if (image.original?.startsWith("blob:"))
            URL.revokeObjectURL(image.original);
          if (
            image.current?.startsWith("blob:") &&
            image.current !== image.original
          )
            URL.revokeObjectURL(image.current);
        });
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./sw.js")
          .catch((err) => console.error("SW registration failed:", err));
      }
      //#endregion
    </script>
  </body>
