<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes"
    />
    <title>PicStitch - Windows Pro</title>
    <link rel="manifest" href="manifest.json" />

    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="image/icon-192.png" />

    <link rel="stylesheet" href="cropper.min.css" />
    <link rel="stylesheet" href="mobile-drag-drop.css" />
    <script src="mobile-drag-drop.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        MobileDragDrop.polyfill({
          dragImageTranslateOverride:
            MobileDragDrop.scrollBehaviourDragImageTranslateOverride,
          holdToDrag: 300,
          forceApply: true,
        });

        window.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });
      });
    </script>
    <script src="cropper.min.js"></script>
    <script src="jspdf.umd.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        overscroll-behavior-x: none;
      }

      body {
        margin: 0;
        background: #0f1115;
        color: #e2e8f0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      input,
      select {
        -webkit-user-select: auto;
        user-select: auto;
      }

      header {
        padding: 20px 16px;
        background: transparent;
        text-align: center;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #ffffff;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
      }

      .upload-section {
        margin-bottom: 20px;
      }

      .file-dropzone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 2px dashed rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .file-dropzone:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: #4f46e5;
      }

      .file-dropzone .icon {
        font-size: 32px;
        margin-bottom: 12px;
      }

      .file-dropzone .text {
        color: #94a3b8;
        font-size: 16px;
        font-weight: 500;
      }

      .file-dropzone input[type="file"] {
        display: none;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }

      button {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 14px;
        font-size: 14.2px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        touch-action: manipulation;
      }

      button:hover {
        background: #4f46e5;
        color: #ffffff;
        border-color: #4f46e5;
        transform: translateY(-2px);
      }

      .custom-select-wrapper {
        background: #1e293b;
        padding: 16px 20px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .custom-select-wrapper label {
        font-weight: 500;
        color: #e2e8f0;
        font-size: 15px;
      }

      .modern-select {
        background: #0f1115;
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 12px 40px 12px 16px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        outline: none;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        min-width: 160px;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 14px top 50%;
        background-size: 12px auto;
        transition: all 0.2s ease;
      }

      .modern-select:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
      }

      .preview-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }

      .preview-item {
        position: relative;
        width: 100%;
        aspect-ratio: 9 / 16;
        height: auto;
        background: #1b1b1b;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }

      .preview-item img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #0f1115;
        display: block;
        pointer-events: none;
      }

      .preview-delete {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.9);
        color: white;
        border: none;
        z-index: 20;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(4px);
      }

      .preview-badge {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 26px;
        height: 26px;
        z-index: 20;
        cursor: pointer;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.4);
        border: 2px solid #ffffff;
        color: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        backdrop-filter: blur(4px);
        transition: all 0.2s ease;
      }

      .preview-badge.selected {
        background: #4f46e5;
        border-color: #4f46e5;
        color: #ffffff;
      }

      .preview-delete:hover {
        background: rgb(239, 68, 68);
        transform: scale(1.1);
      }

      #canvas {
        width: 100%;
        height: auto;
        object-fit: contain;
        border-radius: 12px;
        display: none;
        background: transparent;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        cursor: pointer;
      }

      #cropModal {
        display: none;
        position: fixed;
        inset: 0;
        background: #0f1115;
        z-index: 99999;
        flex-direction: column;
        overscroll-behavior: none;
      }

      .crop-header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: #1e293b;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .crop-title {
        font-size: 18px;
        font-weight: 600;
      }

      .crop-body {
        flex: 1;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        min-height: 0;
        min-width: 0;
      }

      #cropImage {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        max-width: none;
        max-height: none;
      }

      /* FIX 1: The New Button Layout Container */
      .crop-controls {
        height: auto;
        padding: 16px;
        display: flex;
        flex-direction: column; /* Stacks the Free Form button on top */
        justify-content: center;
        align-items: center;
        background: #1e293b;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      .crop-controls-row {
        display: flex;
        width: 100%;
        gap: 12px;
      }

      .crop-controls button {
        font-size: 14px;
        padding: 14px 8px;
        flex: 1;
        min-width: 0;
        background: #334155;
      }

      .crop-controls button:hover {
        background: #4f46e5;
      }

      .cropper-point {
        width: 38px !important;
        height: 38px !important;
        opacity: 1 !important;
        background-color: #4f46e5 !important;
      }

      .cropper-line {
        background-color: #4f46e5 !important;
      }

      .cropper-point.point-se {
        width: 32px !important;
        height: 32px !important;
      }

      .cropper-view-box {
        outline: 2px solid #4f46e5 !important;
      }

      .cropper-face {
        background: rgba(79, 70, 229, 0.15) !important;
      }

      .cropper-container {
        width: 100% !important;
        height: 100% !important;
      }

      .cropper-container img {
        max-width: none !important;
      }

      #cropModal {
        animation: fadeIn 0.15s ease-out forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .toast {
        position: fixed;
        /* Lock the final position in place */
        top: calc(env(safe-area-inset-top, 20px) + 20px);
        left: 50%;
        /* Start hidden slightly higher up */
        transform: translate(-50%, -20px);
        opacity: 0;
        visibility: hidden;

        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 12px 24px;
        border-radius: 30px;
        font-size: 15px;
        font-weight: 600;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        z-index: 9999999;
        pointer-events: none; /* Prevents it from blocking your taps */

        /* Smooth fade and slide for both appearing and disappearing */
        transition:
          transform 0.4s ease-out,
          opacity 0.4s ease-out,
          visibility 0.4s ease-out;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }

      .toast.show {
        /* Drop into exact center and become fully visible */
        transform: translate(-50%, 0);
        opacity: 1;
        visibility: visible;
      }

      button:active {
        transform: scale(0.96);
      }

      #freeCropCanvas,
      #freeCropImage {
        transition: transform 0.08s ease-out;
      }

      /*  .preview-item,
      button,
      #canvas,
      #magnifier {
        will-change: transform;
        transform: translateZ(0);
      } */
    </style>
  </head>

  <body>
    <header>PicStitch PWA</header>

    <div class="container">
      <div class="upload-section">
        <label for="imageInput" class="file-dropzone">
          <div class="icon">📁</div>
          <div class="text">Click to Select Images</div>
          <input type="file" id="imageInput" multiple accept="image/*" />
        </label>
      </div>

      <div class="controls">
        <button onclick="combineVertical()">Vertical Stitch</button>
        <button onclick="combineHorizontal()">Horizontal Stitch</button>
        <button onclick="saveCanvasAsGroup()">Save Group</button>
        <button onclick="downloadImage(event)">Export Image</button>
        <button onclick="exportPDF(event)">Export PDF</button>
      </div>

      <div class="slider-group custom-select-wrapper">
        <label for="qualitySelect">Export Quality:</label>
        <select id="qualitySelect" class="modern-select">
          <option value="0.6">Good (Small JPG)</option>
          <option value="0.8">Better (High JPG)</option>
          <option value="1" selected>Best (Lossless PNG)</option>
        </select>
      </div>

      <div
        style="
          margin-bottom: 12px;
          color: #94a3b8;
          font-size: 14px;
          text-align: center;
        "
      >
        Click Photos Below to Crop
      </div>

      <div class="preview-list" id="previewList"></div>
      <canvas id="canvas"></canvas>
    </div>

    <div id="cropModal">
      <div class="crop-header">
        <button onclick="closeCrop()">← Back</button>
        <div class="crop-title" id="cropModeTitle">Standard Crop Mode</div>
        <button id="applyBtn" onclick="applyCrop()">Apply</button>
      </div>

      <div class="crop-body">
        <img id="cropImage" />

        <div
          id="freeCropContainer"
          style="display: none; position: relative; width: 100%; height: 100%"
        >
          <img
            id="freeCropImage"
            style="
              display: block;
              width: 100%;
              height: 100%;
              object-fit: contain;
            "
            draggable="false"
          />
          <canvas
            id="freeCropCanvas"
            style="
              display: block;
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              touch-action: none;
              cursor: crosshair;
            "
          ></canvas>
        </div>
      </div>

      <div class="crop-controls">
        <div class="crop-controls-row">
          <button
            id="toggleCropBtn"
            onclick="toggleCropMode()"
            style="background: #0ea5e9"
          >
            Perspective Crop
          </button>

          <button onclick="resetCrop()">Reset</button>
        </div>
      </div>
    </div>

    <div id="toastNotification" class="toast"></div>

    <script>
      let cropper = null;
      let currentCropIndex = null;
      let cropMode = "image";
      let cropHistory = {};
      let redoHistory = {};
      let images = [];
      let combineMode = null;
      let isRestoringHistory = false;
      let draggedIndex = null;
      let isProcessing = false;
      let isCombining = false;

      // Free Form Crop Variables
      let isFreeForm = false;
      let freeCorners = [];
      let activeCorner = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;

      let lastTouchX = 0;
      let lastTouchY = 0;

      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const imageInput = document.getElementById("imageInput");
      const previewList = document.getElementById("previewList");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", {
        alpha: false,
        desynchronized: false,
        willReadFrequently: false,
      });

      // HIGH-END GOD MODE FOR WINDOWS
      function getDeviceLimits() {
        return { area: 100000000, dimension: 40000 };
      }

      canvas.addEventListener("click", () => {
        if (canvas.width <= 1 || canvas.height <= 1) return;
        cropCombined();
      });

      imageInput.addEventListener("change", async (e) => {
        const files = [...e.target.files];
        if (files.length === 0) return;

        showToast("Loading images...");
        const loadedImages = [];

        for (const file of files) {
          try {
            const objectUrl = URL.createObjectURL(file);
            const img = new Image();

            await new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = reject;
              img.src = objectUrl;
            });

            loadedImages.push({
              id:
                window.crypto && window.crypto.randomUUID
                  ? window.crypto.randomUUID()
                  : Date.now().toString(36),

              original: objectUrl,

              current: objectUrl,

              img,

              cropData: null,

              freeFormData: null,

              selected: true,
            });

            await new Promise((resolve) => requestAnimationFrame(resolve));
          } catch (error) {
            console.error("Image load failed:", error);
          }
        }

        images.push(...loadedImages);
        renderPreview();
        rerenderCanvas();
        e.target.value = "";
        showToast("Images Loaded!");
      });

      clearCanvas();

      function renderPreview() {
        previewList.innerHTML = "";
        let currentNumber = 1;

        images.forEach((item, index) => {
          const div = document.createElement("div");
          div.className = "preview-item";
          div.draggable = true;

          let badgeClass = "preview-badge";
          let badgeText = "";
          if (item.selected) {
            badgeClass += " selected";
            badgeText = currentNumber++;
          }

          div.innerHTML = `
            <img src="${item.current}">
            <div class="${badgeClass}">${badgeText}</div>
            <button class="preview-delete">✕</button>
          `;

          const deleteBtn = div.querySelector(".preview-delete");
          const badge = div.querySelector(".preview-badge");

          badge.addEventListener("click", (e) => {
            e.stopPropagation();
            item.selected = !item.selected;
            renderPreview();
            rerenderCanvas();
          });

          deleteBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            removeImage(index);
          });

          div.addEventListener("click", () => {
            openCrop(index);
          });

          div.addEventListener("dragstart", () => {
            draggedIndex = index;
          });
          div.addEventListener("dragover", (e) => e.preventDefault());
          div.addEventListener("dragenter", (e) => e.preventDefault());

          div.addEventListener("drop", (e) => {
            e.preventDefault();
            const from = draggedIndex;
            const to = index;
            if (from === to) return;
            const moved = images.splice(from, 1)[0];
            images.splice(to, 0, moved);
            rerenderCanvas();
            renderPreview();
          });

          previewList.appendChild(div);
        });
      }

      function removeImage(index) {
        const image = images[index];
        if (image.original && image.original.startsWith("blob:"))
          URL.revokeObjectURL(image.original);
        delete cropHistory[image.id];
        delete redoHistory[image.id];

        images.splice(index, 1);

        if (currentCropIndex === index) {
          closeCrop();
          currentCropIndex = null;
        }

        if (images.length === 0) {
          imageInput.value = "";
          combineMode = null;
          clearCanvas();
        } else {
          rerenderCanvas();
        }
        renderPreview();
      }

      /*  function rerenderCanvas() {
        const activeImages = images.filter((item) => item.selected);
        if (activeImages.length === 0) {
          clearCanvas();
          return;
        }
        if (combineMode === "vertical") combineVertical(false);
        else if (combineMode === "horizontal") combineHorizontal(false);
        else if (activeImages.length === 1) {
          combineVertical(false);
          combineMode = null;
        }
      } */

      function rerenderCanvas() {
        const activeImages = images.filter((item) => item.selected);

        if (activeImages.length === 0) {
          clearCanvas();
          return;
        }

        // ONLY RENDER WHEN USER EXPLICITLY CHOOSES
        if (combineMode === "vertical") {
          combineVertical(false);
        } else if (combineMode === "horizontal") {
          combineHorizontal(false);
        } else {
          clearCanvas();
        }
      }

      function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.width = 1;
        canvas.height = 1;
        canvas.style.display = "none";
      }

      function combineVertical(showMessage = true) {
        if (isCombining) return;
        isCombining = true;

        const activeImages = images.filter((item) => item.selected);
        if (activeImages.length === 0) {
          showToast("Please select images first", true);
          clearCanvas();
          isCombining = false;
          return;
        }

        combineMode = "vertical";
        canvas.style.display = "block";
        if (showMessage) showToast("Loading Vertical Stitch...");

        setTimeout(() => {
          const widths = activeImages.map((item) =>
            item.cropData ? item.cropData.width : item.img.width,
          );
          const targetWidth = Math.max(...widths);
          let totalHeight = 0;
          const scaledImages = [];

          for (const item of activeImages) {
            let sourceWidth = item.img.width,
              sourceHeight = item.img.height;
            if (item.cropData) {
              sourceWidth = item.cropData.width;
              sourceHeight = item.cropData.height;
            }
            const scale = targetWidth / sourceWidth;
            const scaledHeight = sourceHeight * scale;

            scaledImages.push({
              item,
              width: targetWidth,
              height: scaledHeight,
            });
            totalHeight += scaledHeight;
          }

          const limits = getDeviceLimits();
          let finalScale = 1;
          if (targetWidth * totalHeight > limits.area)
            finalScale = Math.sqrt(limits.area / (targetWidth * totalHeight));
          if (totalHeight * finalScale > limits.dimension)
            finalScale = limits.dimension / totalHeight;
          if (targetWidth * finalScale > limits.dimension)
            finalScale = limits.dimension / targetWidth;

          canvas.width = targetWidth * finalScale;
          canvas.height = totalHeight * finalScale;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.imageSmoothingEnabled = false;

          let y = 0;
          for (const scaled of scaledImages) {
            const crop = scaled.item.cropData;
            const drawWidth = scaled.width * finalScale;
            const drawHeight = scaled.height * finalScale;

            if (crop)
              ctx.drawImage(
                scaled.item.img,
                crop.x,
                crop.y,
                crop.width,
                crop.height,
                0,
                y,
                drawWidth,
                drawHeight,
              );
            else ctx.drawImage(scaled.item.img, 0, y, drawWidth, drawHeight);
            y += drawHeight;
          }
          isCombining = false;
        }, 50);
      }

      function combineHorizontal(showMessage = true) {
        if (isCombining) return;
        isCombining = true;

        const activeImages = images.filter((item) => item.selected);
        if (activeImages.length === 0) {
          showToast("Please select images first", true);
          clearCanvas();
          isCombining = false;
          return;
        }

        combineMode = "horizontal";
        canvas.style.display = "block";
        if (showMessage) showToast("Loading Horizontal Stitch...");

        setTimeout(() => {
          const heights = activeImages.map((item) =>
            item.cropData ? item.cropData.height : item.img.height,
          );
          const targetHeight = Math.max(...heights);
          let totalWidth = 0;
          const scaledImages = [];

          for (const item of activeImages) {
            let sourceWidth = item.img.width,
              sourceHeight = item.img.height;
            if (item.cropData) {
              sourceWidth = item.cropData.width;
              sourceHeight = item.cropData.height;
            }
            const scale = targetHeight / sourceHeight;
            const scaledWidth = sourceWidth * scale;

            scaledImages.push({
              item,
              width: scaledWidth,
              height: targetHeight,
            });
            totalWidth += scaledWidth;
          }

          const limits = getDeviceLimits();
          let finalScale = 1;
          if (totalWidth * targetHeight > limits.area)
            finalScale = Math.sqrt(limits.area / (totalWidth * targetHeight));
          if (totalWidth * finalScale > limits.dimension)
            finalScale = limits.dimension / totalWidth;
          if (targetHeight * finalScale > limits.dimension)
            finalScale = limits.dimension / targetHeight;

          canvas.width = totalWidth * finalScale;
          canvas.height = targetHeight * finalScale;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.imageSmoothingEnabled = false;

          let x = 0;
          for (const scaled of scaledImages) {
            const crop = scaled.item.cropData;
            const drawWidth = scaled.width * finalScale;
            const drawHeight = scaled.height * finalScale;

            if (crop)
              ctx.drawImage(
                scaled.item.img,
                crop.x,
                crop.y,
                crop.width,
                crop.height,
                x,
                0,
                drawWidth,
                drawHeight,
              );
            else ctx.drawImage(scaled.item.img, x, 0, drawWidth, drawHeight);
            x += drawWidth;
          }
          isCombining = false;
        }, 50);
      }

      function saveCropState() {
        if (!cropper || isRestoringHistory) return;
        const state = cropper.getData();
        const key =
          cropMode === "combined" ? "combined" : images[currentCropIndex].id;

        if (!cropHistory[key]) cropHistory[key] = [];
        if (!redoHistory[key]) redoHistory[key] = [];

        const history = cropHistory[key];
        const last = history[history.length - 1];

        if (last && JSON.stringify(last) === JSON.stringify(state)) return;
        history.push(JSON.parse(JSON.stringify(state)));
        if (history.length > 50) history.shift();
        redoHistory[key] = [];
      }

      function openCrop(index) {
        cropMode = "image";

        currentCropIndex = index;

        isFreeForm = false;

        const modal = document.getElementById("cropModal");

        const cropImage = document.getElementById("cropImage");

        const freeContainer = document.getElementById("freeCropContainer");

        document.getElementById("toggleCropBtn").style.background = "#0ea5e9";

        freeContainer.style.display = "none";

        cropImage.style.display = "block";

        if (cropper) {
          cropper.destroy();
          cropper = null;
        }

        cropImage.removeAttribute("src");

        modal.style.display = "flex";
        const imageObj = images[index];

        cropImage.onload = () => {
          cropper = new Cropper(cropImage, {
            minContainerWidth: 300,
            minContainerHeight: 300,

            cropend() {
              saveCropState();
            },

            viewMode: 0,
            autoCropArea: 1,
            responsive: true,
            background: false,
            movable: false,
            zoomable: true,
            scalable: true,
            rotatable: true,
            guides: true,
            center: true,
            highlight: true,
            cropBoxMovable: false,
            cropBoxResizable: true,
            dragMode: "move",
            toggleDragModeOnDblclick: false,

            zoomOnTouch: false,

            zoomOnWheel: false,
            modal: true,
            restore: false,
            checkOrientation: true,

            ready() {
              const savedCrop = images[index].cropData;

              if (savedCrop) {
                cropper.setData(savedCrop);
              }

              const key = images[currentCropIndex].id;

              cropHistory[key] = [
                JSON.parse(JSON.stringify(cropper.getData())),
              ];

              redoHistory[key] = [];
            },
          });
        };

        cropImage.src = images[index].original;
      }

      function cropCombined() {
        if (canvas.width <= 1 || canvas.height <= 1) return;
        cropMode = "combined";
        currentCropIndex = null;

        resetToStandardUI();

        const modal = document.getElementById("cropModal");
        const cropImage = document.getElementById("cropImage");
        if (cropper) {
          cropper.destroy();
          cropper = null;
        }
        cropImage.removeAttribute("src");
        modal.style.display = "flex";

        canvas.toBlob(
          (blob) => {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            cropImage.onload = () => {
              cropper = new Cropper(cropImage, {
                minContainerWidth: 300,
                minContainerHeight: 300,
                cropend() {
                  saveCropState();
                },
                ready() {
                  cropHistory["combined"] = [
                    JSON.parse(JSON.stringify(cropper.getData())),
                  ];
                  redoHistory["combined"] = [];
                  URL.revokeObjectURL(url);
                },
                viewMode: 0,
                autoCropArea: 1,
                responsive: true,
                background: false,
                movable: false,
                zoomable: true,
                scalable: true,
                rotatable: true,
                guides: true,
                center: true,
                highlight: true,
                cropBoxMovable: false,
                cropBoxResizable: true,
                dragMode: "move",

                toggleDragModeOnDblclick: false,

                zoomOnTouch: false,

                zoomOnWheel: false,
              });
            };
            cropImage.src = url;
          },
          "image/webp",
          0.9,
        );
      }

      // TOGGLE CROP MODES
      function resetToStandardUI() {
        isFreeForm = false;
        document.getElementById("cropModeTitle").innerText =
          "Standard Crop Mode";
        document.getElementById("toggleCropBtn").innerText =
          "Click to Perspective Crop";

        document.getElementById("freeCropContainer").style.display = "none";
        document.getElementById("cropImage").style.display = "block";

      function toggleCropMode() {
        isFreeForm = !isFreeForm;

        const btn = document.getElementById("toggleCropBtn");

        const normalImg = document.getElementById("cropImage");

        const freeContainer = document.getElementById("freeCropContainer");

        } else {
          activeCorner = null;

          btn.innerText = "Click to Perspective Crop";
          btn.style.background = "#0ea5e9";

          freeContainer.style.display = "none";

          if (cropMode === "combined") {

      // FREE FORM CROP LOGIC
      const fCanvas = document.getElementById("freeCropCanvas");

      function initFreeCrop() {
        const img = document.getElementById("freeCropImage");
        const container = document.getElementById("freeCropContainer");

        if (container.clientWidth === 0 || img.naturalWidth === 0) {
          setTimeout(initFreeCrop, 50);
          return;
        }

        fCanvas.width = container.clientWidth;
        fCanvas.height = container.clientHeight;

        const imgRatio = img.naturalWidth / img.naturalHeight;
        const containerRatio = fCanvas.width / fCanvas.height;

        let drawW,
          drawH,
          offsetX = 0,
          offsetY = 0;
        if (imgRatio > containerRatio) {
          drawW = fCanvas.width;
          drawH = drawW / imgRatio;
          offsetY = (fCanvas.height - drawH) / 2;
        } else {
          drawH = fCanvas.height;
          drawW = drawH * imgRatio;
          offsetX = (fCanvas.width - drawW) / 2;
        }

        // START AT CORNERS (0 margin instead of 10%)
        freeCorners = [
          { x: offsetX, y: offsetY },
          { x: offsetX + drawW, y: offsetY },
          { x: offsetX + drawW, y: offsetY + drawH },
          { x: offsetX, y: offsetY + drawH },
        ];
        drawFreeCrop();
      }

      function drawFreeCrop() {
        const ctx = fCanvas.getContext("2d");
        ctx.clearRect(0, 0, fCanvas.width, fCanvas.height);

        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.beginPath();
        ctx.rect(0, 0, fCanvas.width, fCanvas.height);
        ctx.moveTo(freeCorners[0].x, freeCorners[0].y);
        ctx.lineTo(freeCorners[3].x, freeCorners[3].y);
        ctx.lineTo(freeCorners[2].x, freeCorners[2].y);
        ctx.lineTo(freeCorners[1].x, freeCorners[1].y);
        ctx.closePath();
        ctx.fill("evenodd");

        ctx.strokeStyle = "#0ea5e9";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(freeCorners[0].x, freeCorners[0].y);
        ctx.lineTo(freeCorners[1].x, freeCorners[1].y);
        ctx.lineTo(freeCorners[2].x, freeCorners[2].y);
        ctx.lineTo(freeCorners[3].x, freeCorners[3].y);
        ctx.closePath();
        ctx.stroke();

        const handleRadius = 30;
        const lineSize = 18;

        ctx.lineWidth = 5;
        ctx.strokeStyle = "#3b82f6";

        freeCorners.forEach((c, i) => {
          // Transparent touch area
          ctx.beginPath();

          ctx.arc(c.x, c.y, handleRadius, 0, Math.PI * 2);

          ctx.fillStyle = "rgba(120,140,255,0.22)";

          ctx.fill();

          ctx.beginPath();

          // TOP LEFT
          if (i === 0) {
            ctx.moveTo(c.x + lineSize, c.y);
            ctx.lineTo(c.x, c.y);
            ctx.lineTo(c.x, c.y + lineSize);
          }

          // TOP RIGHT
          else if (i === 1) {
            ctx.moveTo(c.x - lineSize, c.y);
            ctx.lineTo(c.x, c.y);
            ctx.lineTo(c.x, c.y + lineSize);
          }

          // BOTTOM RIGHT
          else if (i === 2) {
            ctx.moveTo(c.x - lineSize, c.y);
            ctx.lineTo(c.x, c.y);
            ctx.lineTo(c.x, c.y - lineSize);
          }

          // BOTTOM LEFT
          else if (i === 3) {
            ctx.moveTo(c.x + lineSize, c.y);
            ctx.lineTo(c.x, c.y);
            ctx.lineTo(c.x, c.y - lineSize);
          }

          ctx.stroke();
        });
      }

      function getMousePos(e) {
        const rect = fCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      fCanvas.addEventListener("mousedown", startDrag);
      fCanvas.addEventListener("touchstart", startDrag, { passive: false });
      fCanvas.addEventListener("mousemove", drag);
      fCanvas.addEventListener("touchmove", drag, { passive: false });
      window.addEventListener("mouseup", stopDrag);
      window.addEventListener("touchend", stopDrag);

      function startDrag(e) {
        if (!isFreeForm) return;

        const pos = getMousePos(e);

        let minDist = 65;

        activeCorner = null;

        freeCorners.forEach((c) => {
          const dist = Math.hypot(c.x - pos.x, c.y - pos.y);

          if (dist < minDist) {
            minDist = dist;
            activeCorner = c;
          }
        });

        if (activeCorner) {
          // STORE RELATIVE OFFSET
          dragOffsetX = pos.x - activeCorner.x;
          dragOffsetY = pos.y - activeCorner.y;

          lastTouchX = pos.x;
          lastTouchY = pos.y;

          e.preventDefault();
        }
      }

      function drag(e) {
        if (!isFreeForm || !activeCorner) return;

        e.preventDefault();

        const pos = getMousePos(e);

        // RELATIVE MOVEMENT
        const dx = pos.x - lastTouchX;
        const dy = pos.y - lastTouchY;

        // SHARPSCAN-LIKE CONTROL
        const sensitivity = 0.5;

        activeCorner.x += dx * sensitivity;
        activeCorner.y += dy * sensitivity;

        activeCorner.x = Math.max(0, Math.min(fCanvas.width, activeCorner.x));

        activeCorner.y = Math.max(0, Math.min(fCanvas.height, activeCorner.y));

        lastTouchX = pos.x;
        lastTouchY = pos.y;

        drawFreeCrop();
      }

      function stopDrag() {
        activeCorner = null;
      }

      // PURE MATH REVERSE-HOMOGRAPHY FLATTENER
      function applyFreeFormCrop() {
        const btn = document.getElementById("applyBtn");

        btn.innerText = "Applying Matrix...";
        btn.disabled = true;

        setTimeout(() => {
          const img = document.getElementById("freeCropImage");

          const imgRatio = img.naturalWidth / img.naturalHeight;
          const containerRatio = fCanvas.width / fCanvas.height;

          let drawW,
            drawH,
            offsetX = 0,
            offsetY = 0;

          if (imgRatio > containerRatio) {
            drawW = fCanvas.width;
            drawH = drawW / imgRatio;
            offsetY = (fCanvas.height - drawH) / 2;
          } else {
            drawH = fCanvas.height;
            drawW = drawH * imgRatio;
            offsetX = (fCanvas.width - drawW) / 2;
          }

          const scale = img.naturalWidth / drawW;

          function sortCorners(pts) {
            const center = {
              x: pts.reduce((s, p) => s + p.x, 0) / 4,
              y: pts.reduce((s, p) => s + p.y, 0) / 4,
            };

            pts.sort((a, b) => {
              const angleA = Math.atan2(a.y - center.y, a.x - center.x);
              const angleB = Math.atan2(b.y - center.y, b.x - center.x);
              return angleA - angleB;
            });

            let topLeft = pts.reduce((prev, curr) =>
              curr.x + curr.y < prev.x + prev.y ? curr : prev,
            );

            while (pts[0] !== topLeft) {
              pts.push(pts.shift());
            }

            return pts;
          }

          const pts = sortCorners(
            freeCorners.map((c) => ({
              x: (c.x - offsetX) * scale,
              y: (c.y - offsetY) * scale,
            })),
          );
          const w1 = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          const w2 = Math.hypot(pts[2].x - pts[3].x, pts[2].y - pts[3].y);

          const h1 = Math.hypot(pts[3].x - pts[0].x, pts[3].y - pts[0].y);
          const h2 = Math.hypot(pts[2].x - pts[1].x, pts[2].y - pts[1].y);

          const avgTopBottom = (w1 + w2) / 2;
          const avgLeftRight = (h1 + h2) / 2;

          const aspectRatio = avgTopBottom / avgLeftRight;

          const destW = Math.round(avgTopBottom);
          const destH = Math.round(destW / aspectRatio);

          const offscreen = document.createElement("canvas");

          offscreen.width = destW;
          offscreen.height = destH;

          const offCtx = offscreen.getContext("2d", {
            willReadFrequently: true,
          });

          const srcCanvas = document.createElement("canvas");

          srcCanvas.width = img.naturalWidth;
          srcCanvas.height = img.naturalHeight;

          srcCanvas
            .getContext("2d", {
              willReadFrequently: true,
            })
            .drawImage(img, 0, 0);

          const srcData = srcCanvas
            .getContext("2d")
            .getImageData(0, 0, srcCanvas.width, srcCanvas.height);

          const destData = offCtx.createImageData(destW, destH);

          const srcBuf = new Uint32Array(srcData.data.buffer);
          const destBuf = new Uint32Array(destData.data.buffer);

          const x0 = pts[0].x;
          const y0 = pts[0].y;

          const x1 = pts[1].x;
          const y1 = pts[1].y;

          const x2 = pts[2].x;
          const y2 = pts[2].y;

          const x3 = pts[3].x;
          const y3 = pts[3].y;

          const dx1 = x1 - x2;
          const dx2 = x3 - x2;
          const dx3 = x0 - x1 + x2 - x3;

          const dy1 = y1 - y2;
          const dy2 = y3 - y2;
          const dy3 = y0 - y1 + y2 - y3;

          let a11, a21, a31;
          let a12, a22, a32;
          let a13, a23, a33;

          if (dx3 === 0 && dy3 === 0) {
            a11 = x1 - x0;
            a21 = x3 - x0;
            a31 = x0;

            a12 = y1 - y0;
            a22 = y3 - y0;
            a32 = y0;

            a13 = 0;
            a23 = 0;
            a33 = 1;
          } else {
            const det = dx1 * dy2 - dx2 * dy1;

            a13 = (dx3 * dy2 - dx2 * dy3) / det;
            a23 = (dx1 * dy3 - dx3 * dy1) / det;

            a11 = x1 - x0 + a13 * x1;
            a21 = x3 - x0 + a23 * x3;
            a31 = x0;

            a12 = y1 - y0 + a13 * y1;
            a22 = y3 - y0 + a23 * y3;
            a32 = y0;

            a33 = 1;
          }

          const sw = srcCanvas.width;
          const sh = srcCanvas.height;

          for (let y = 0; y < destH; y++) {
            const t = y / (destH - 1);

            const leftX = pts[0].x + (pts[3].x - pts[0].x) * t;

            const leftY = pts[0].y + (pts[3].y - pts[0].y) * t;

            const rightX = pts[1].x + (pts[2].x - pts[1].x) * t;

            const rightY = pts[1].y + (pts[2].y - pts[1].y) * t;

            for (let x = 0; x < destW; x++) {
              const s = x / (destW - 1);

              const srcX = leftX + (rightX - leftX) * s;

              const srcY = leftY + (rightY - leftY) * s;

              if (srcX >= 0 && srcX < sw - 1 && srcY >= 0 && srcY < sh - 1) {
                const ix = Math.floor(srcX);
                const iy = Math.floor(srcY);

                destBuf[y * destW + x] = srcBuf[iy * sw + ix];
              }
            }
          }

          offCtx.putImageData(destData, 0, 0);

          offscreen.toBlob(
            (blob) => {
              const url = URL.createObjectURL(blob);

              if (cropMode === "combined") {
                const finalImg = new Image();

                finalImg.onload = () => {
                  canvas.width = finalImg.width;
                  canvas.height = finalImg.height;

                  ctx.clearRect(0, 0, canvas.width, canvas.height);

                  ctx.drawImage(finalImg, 0, 0);

                  URL.revokeObjectURL(url);

                  closeCrop();

                  btn.innerText = "Apply";
                  btn.disabled = false;
                };

                finalImg.src = url;
              } else {
                const imgObj = images[currentCropIndex];

                if (imgObj.original && imgObj.original.startsWith("blob:")) {
                  URL.revokeObjectURL(imgObj.original);
                }

                const previewUrl = URL.createObjectURL(blob);

                const updatedImg = new Image();

                updatedImg.onload = () => {
                  imgObj.current = previewUrl;

                  imgObj.original = previewUrl;

                  imgObj.img = updatedImg;

                  imgObj.cropData = null;

                  imgObj.freeFormData = true;

                  rerenderCanvas();

                  renderPreview();

                  closeCrop();

                  btn.innerText = "Apply";

                  btn.disabled = false;
                };

                updatedImg.src = previewUrl;

                rerenderCanvas();

                renderPreview();

                closeCrop();

                btn.innerText = "Apply";

                btn.disabled = false;

                URL.revokeObjectURL(url);
              }
            },
            "image/png",
            1,
          );
        }, 50);
      }

      function applyCrop() {
        if (isFreeForm) {
          applyFreeFormCrop();
          return;
        }

        if (!cropper) return;

        if (cropMode === "combined") {
          applyCombinedCrop();
          return;
        }

        const cropData = cropper.getData();

        // STORE CROP ONLY
        images[currentCropIndex].cropData = {
          x: cropData.x,
          y: cropData.y,
          width: cropData.width,
          height: cropData.height,
        };

        // CREATE PREVIEW IMAGE ONLY
        const croppedCanvas = cropper.getCroppedCanvas();

        croppedCanvas.toBlob(
          (blob) => {
            const previewUrl = URL.createObjectURL(blob);

            const oldCurrent = images[currentCropIndex].current;

            if (
              oldCurrent &&
              oldCurrent.startsWith("blob:") &&
              oldCurrent !== images[currentCropIndex].original
            ) {
              URL.revokeObjectURL(oldCurrent);
            }

            // ONLY CHANGE PREVIEW
            images[currentCropIndex].current = previewUrl;

            // DO NOT REPLACE ORIGINAL IMAGE
            // DO NOT CHANGE images[currentCropIndex].img

            rerenderCanvas();

            renderPreview();

            closeCrop();
          },
          "image/webp",
          0.85,
        );
      }

      function applyCombinedCrop() {
        const croppedCanvas = cropper.getCroppedCanvas();
        canvas.width = croppedCanvas.width;
        canvas.height = croppedCanvas.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(croppedCanvas, 0, 0);
        closeCrop();
      }

      function resetCrop() {
        // PERSPECTIVE RESET
        if (isFreeForm) {
          initFreeCrop();

          return;
        }

        // STANDARD RESET
        if (cropMode !== "image" || currentCropIndex === null) {
          return;
        }

        const imgObj = images[currentCropIndex];

        imgObj.cropData = null;

        if (!imgObj.freeFormData) {
          if (
            imgObj.current &&
            imgObj.current !== imgObj.original &&
            imgObj.current.startsWith("blob:")
          ) {
            URL.revokeObjectURL(imgObj.current);
          }

          imgObj.current = imgObj.original;
        }

        renderPreview();

        rerenderCanvas();

        if (cropper) {
          cropper.reset();

          setTimeout(() => {
            cropper.clear();
            cropper.crop();
          }, 30);
        }
      }

      function undoCrop() {
        const key =
          cropMode === "combined" ? "combined" : images[currentCropIndex].id;
        const history = cropHistory[key];
        if (!history || history.length < 2) return;
        const current = history.pop();
        if (!redoHistory[key]) redoHistory[key] = [];
        redoHistory[key].push(current);
        isRestoringHistory = true;
        cropper.setData(history[history.length - 1]);
        setTimeout(() => {
          isRestoringHistory = false;
        }, 50);
      }

      function redoCrop() {
        const key =
          cropMode === "combined" ? "combined" : images[currentCropIndex].id;
        const redo = redoHistory[key];
        if (!redo || redo.length === 0) return;
        const next = redo.pop();
        if (!cropHistory[key]) cropHistory[key] = [];
        cropHistory[key].push(next);
        isRestoringHistory = true;
        cropper.setData(next);
        setTimeout(() => {
          isRestoringHistory = false;
        }, 50);
      }

      function closeCrop() {
        const modal = document.getElementById("cropModal");
        modal.style.display = "none";
        if (cropper) {
          cropper.destroy();
          cropper = null;
        }
        document.getElementById("cropImage").removeAttribute("src");
        document.getElementById("freeCropImage").removeAttribute("src");
        resetToStandardUI();
      }

      function saveCanvasAsGroup() {
        if (isProcessing) return;
        isProcessing = true;
        if (canvas.width <= 1 || canvas.height <= 1) {
          showToast("Please stitch images first", true);

          isProcessing = false;

          return;
        }

        canvas.toBlob((blob) => {
          if (!blob) {
            isProcessing = false;
            alert("This group is too large.");
            return;
          }
          const dataUrl = URL.createObjectURL(blob);
          const img = new Image();

          img.onload = () => {
            images = images.filter((item) => {
              if (item.selected) {
                if (item.original?.startsWith("blob:"))
                  URL.revokeObjectURL(item.original);
                if (
                  item.current?.startsWith("blob:") &&
                  item.current !== item.original
                )
                  URL.revokeObjectURL(item.current);
                return false;
              }
              return true;
            });

            images.push({
              id:
                window.crypto && window.crypto.randomUUID
                  ? window.crypto.randomUUID()
                  : Date.now().toString(36),
              original: dataUrl,
              current: dataUrl,
              img,
              cropData: null,
              isGroup: true,
              selected: true,
            });

            const validIds = new Set(images.map((img) => img.id));
            for (const key in cropHistory)
              if (key !== "combined" && !validIds.has(key))
                delete cropHistory[key];
            for (const key in redoHistory)
              if (key !== "combined" && !validIds.has(key))
                delete redoHistory[key];

            combineMode = null;
            clearCanvas();
            renderPreview();
            if (images.length === 1) {
              combineVertical(false);
              combineMode = null;
            }

            showToast("Group Saved Successfully!");
            isProcessing = false;
          };
          img.src = dataUrl;
        }, "image/png");
      }

      let toastTimeout;

      // Failsafe: If iOS freezes the timeout, tapping anywhere forces it to hide
      /* document.addEventListener(
        "touchstart",
        () => {
          const toast = document.getElementById("toastNotification");
          if (toast && toast.classList.contains("show")) {

          }
        },
        { passive: true },
      ); */

      function showToast(message, isError = false) {
        const toast = document.getElementById("toastNotification");

        clearTimeout(toastTimeout);
        toast.classList.remove("show");

        // Keep the text clean and white
        toast.style.color = "#ffffff";
        toast.innerHTML = isError ? `❌ ${message}` : `✅ ${message}`;

        // Reset any background styling that might be lingering
        toast.style.background = "";

        void toast.offsetWidth;

        toast.classList.add("show");

        toastTimeout = setTimeout(() => {
          toast.classList.remove("show");
        }, 2000);
      }

      function validateCanvasSize() {
        const limits = getDeviceLimits();
        if (canvas.width * canvas.height > limits.area)
          throw new Error("Canvas too large for this specific device OS");
      }

      async function exportCanvasBlob(type, quality = 0.9) {
        if ("OffscreenCanvas" in window) {
          const offscreen = new OffscreenCanvas(canvas.width, canvas.height);
          const offCtx = offscreen.getContext("2d");
          offCtx.drawImage(canvas, 0, 0);
          return await offscreen.convertToBlob({ type, quality });
        }
        return await new Promise((resolve) => {
          canvas.toBlob(resolve, type, quality);
        });
      }

      async function downloadImage(e) {
        const btn = e.target;
        const originalText = btn.innerText;
        btn.innerText = "Processing...";
        btn.style.opacity = "0.7";
        btn.disabled = true;

        await new Promise((resolve) => setTimeout(resolve, 50));

        try {
          document.body.style.transform = "translateZ(0)";

          await new Promise((r) => requestAnimationFrame(r));

          document.body.offsetHeight;
          const qualityValue = Number(
            document.getElementById("qualitySelect").value,
          );

          const exportFormat = qualityValue === 1 ? "image/png" : "image/jpeg";
          const fileExtension = qualityValue === 1 ? "png" : "jpg";

          // =========================================
          // 1. EXPORT COMBINED STITCHED CANVAS
          // =========================================
          if (canvas.width > 1 && canvas.height > 1) {
            validateCanvasSize();

            const exportCanvas = canvas;

            const blob = await new Promise((resolve) => {
              exportCanvas.toBlob(resolve, exportFormat, qualityValue);
            });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.download = `PicStitch_${Date.now()}.${fileExtension}`;
            link.href = url;
            link.click();

            setTimeout(() => {
              URL.revokeObjectURL(url);
            }, 1000);

            if (!isIOS) {
              showToast("Image Saved Successfully!");
            }
            return;
          }

          // =========================================
          // 2. EXPORT SELECTED IMAGES (Single or Multiple)
          // =========================================
          const selectedImages = images.filter((img) => img.selected);

          if (selectedImages.length === 0) {
            showToast("No selected image to export", true);
            return;
          }

          // Loop through all selected images and download them sequentially
          for (let i = 0; i < selectedImages.length; i++) {
            const imgObj = selectedImages[i];
            const img = new Image();

            await new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = reject;
              img.src = imgObj.current;
            });

            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = img.naturalWidth;
            tempCanvas.height = img.naturalHeight;
            const tempCtx = tempCanvas.getContext("2d");
            tempCtx.drawImage(img, 0, 0);

            const blob = await new Promise((resolve) => {
              tempCanvas.toBlob(resolve, exportFormat, qualityValue);
            });

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.download = `PicStitch_Selected_${Date.now()}_${i + 1}.${fileExtension}`;

            link.href = url;

            link.click();

            setTimeout(() => {
              URL.revokeObjectURL(url);
            }, 2000);

            // Tiny delay to ensure mobile browsers register separate downloads cleanly
            if (selectedImages.length > 1) {
              await new Promise((resolve) => setTimeout(resolve, 250));
            }
          }

          if (!isIOS) {
            showToast(
              selectedImages.length > 1
                ? "Selected Images Saved!"
                : "Selected Image Saved!",
            );
          }
        } catch (error) {
          console.error("Export failed:", error);
          showToast("Export failed", true);
        } finally {
          document.body.style.transform = "";
          btn.innerText = originalText;
          btn.style.opacity = "1";
          btn.disabled = false;
        }
      }

      async function exportPDF(e) {
        const btn = e.target;
        const originalText = btn.innerText;
        btn.innerText = "Processing...";
        btn.style.opacity = "0.7";
        btn.disabled = true;

        await new Promise((resolve) => setTimeout(resolve, 50));

        try {
          document.body.style.transform = "translateZ(0)";

          await new Promise((r) => requestAnimationFrame(r));

          document.body.offsetHeight;
          const { jsPDF } = window.jspdf;

          // =========================================
          // 1. EXPORT COMBINED CANVAS (If stitched)
          // =========================================
          if (canvas.width > 1 && canvas.height > 1) {
            validateCanvasSize();

            const pdfWidth = 800;
            const scale = pdfWidth / canvas.width;
            const pdfHeight = canvas.height * scale;

            const pdf = new jsPDF({
              orientation: pdfHeight > pdfWidth ? "portrait" : "landscape",
              unit: "px",
              format: [pdfWidth, pdfHeight],
            });

            const blob = await exportCanvasBlob("image/jpeg", 0.75);
            const url = URL.createObjectURL(blob);
            const img = new Image();

            await new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = reject;
              img.src = url;
            });

            pdf.addImage(img, "JPEG", 0, 0, pdfWidth, pdfHeight);
            URL.revokeObjectURL(url);

            const pdfBlob = pdf.output("blob");
            const pdfUrl = URL.createObjectURL(pdfBlob);
            const link = document.createElement("a");
            link.download = `PicStitch_${Date.now()}.pdf`;
            link.href = pdfUrl;

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            setTimeout(() => {
              URL.revokeObjectURL(pdfUrl);
            }, 1000);

            if (!isIOS) {
              showToast("PDF Saved Successfully!");
            }
            return;
          }

          // =========================================
          // 2. EXPORT SINGLE SELECTED PHOTO
          // =========================================
          const selectedImages = images.filter((img) => img.selected);

          if (selectedImages.length > 1) {
            showToast("Select one photo or Stitch photos", true);
            return;
          }

          if (selectedImages.length === 0) {
            showToast("No selected image to export", true);
            return;
          }

          const imgObj = selectedImages[0];
          const img = new Image();

          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = imgObj.current;
          });

          // FIX: Draw to a temporary canvas to bake-in the correct EXIF rotation permanently
          const tempCanvas = document.createElement("canvas");
          tempCanvas.width = img.naturalWidth;
          tempCanvas.height = img.naturalHeight;
          const tempCtx = tempCanvas.getContext("2d");
          tempCtx.drawImage(img, 0, 0);

          // Grab the clean, flattened image data directly
          const cleanImageData = tempCanvas.toDataURL("image/jpeg", 0.85);

          const pdfWidth = 800;
          const scale = pdfWidth / tempCanvas.width;
          const pdfHeight = tempCanvas.height * scale;

          const pdf = new jsPDF({
            orientation: pdfHeight > pdfWidth ? "portrait" : "landscape",
            unit: "px",
            format: [pdfWidth, pdfHeight],
          });

          // Pass the flattened image to jsPDF
          pdf.addImage(cleanImageData, "JPEG", 0, 0, pdfWidth, pdfHeight);

          const pdfBlob = pdf.output("blob");
          const pdfUrl = URL.createObjectURL(pdfBlob);
          const link = document.createElement("a");
          link.download = `PicStitch_Single_${Date.now()}.pdf`;
          link.href = pdfUrl;

          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          setTimeout(() => {
            URL.revokeObjectURL(pdfUrl);
          }, 1000);

          if (!isIOS) {
            showToast("PDF Saved Successfully!");
          }
        } catch (error) {
          console.error("Export failed:", error);
          showToast("Export failed", true);
        } finally {
          document.body.style.transform = "";
          btn.innerText = originalText;
          btn.style.opacity = "1";
          btn.disabled = false;
        }
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.error("SW registration failed:", err);
        });
      }

      window.addEventListener("beforeunload", () => {
        images.forEach((image) => {
          if (image.original?.startsWith("blob:"))
            URL.revokeObjectURL(image.original);
          if (
            image.current?.startsWith("blob:") &&
            image.current !== image.original
          )
            URL.revokeObjectURL(image.current);
        });
      });
    </script>
